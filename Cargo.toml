[package]
name = "kobi-kendo-discord-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.100"
serenity = { version = "0.12.4", features = ["cache", "client", "gateway", "rustls_backend"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.28"
opentelemetry = { version = "0.27", features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio", "logs"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic", "http-proto", "reqwest-client", "trace", "logs"] }
opentelemetry-appender-tracing = "0.27"
tonic = "0.12"
reqwest = { version = "0.12", features = ["blocking"] }
dotenvy = "0.15.7"
